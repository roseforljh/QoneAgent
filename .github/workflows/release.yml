name: Release

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: "指定版本号 (留空则自动从 0.0.1 开始并每次自动 +0.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Calculate Next Version
        id: versioning
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.custom_version }}".Trim()
          if ($inputVer -ne "") {
            $newVer = $inputVer -replace '^v',''
          } else {
            $tags = git tag --list "v*" --sort=-v:refname
            if (-not $tags) {
              $tags = git tag --list "[0-9]*" --sort=-v:refname
            }
            if ($tags) {
              $latestTag = ($tags | Select-Object -First 1) -replace '^v',''
              Write-Host "Latest tag found: $latestTag"
              $parts = $latestTag.Split('.')
              if ($parts.Length -eq 3) {
                $patch = [int]$parts[2] + 1
                $newVer = "$($parts[0]).$($parts[1]).$patch"
              } else {
                $newVer = "0.0.1"
              }
            } else {
              $newVer = "0.0.1"
            }
          }
          $tag = "v$newVer"
          Write-Host "Calculated version: $newVer (tag: $tag)"
          "version=$newVer" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Update Version in package.json
        shell: pwsh
        run: |
          $ver = "${{ steps.versioning.outputs.version }}"
          $pkgFile = "apps/desktop/package.json"
          $json = Get-Content $pkgFile -Raw -Encoding UTF8 | ConvertFrom-Json
          $json.version = $ver
          $json | ConvertTo-Json -Depth 10 | Set-Content $pkgFile -Encoding UTF8

      - name: Install Dependencies
        run: bun install

      - name: Build Windows Release
        run: bun run build:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.versioning.outputs.tag }}"
          git push origin "${{ steps.versioning.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: QoneAgent ${{ steps.versioning.outputs.tag }}
          generate_release_notes: true
          files: |
            apps/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
