<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qone</title>
    <style>
      /* Startup skeleton: mirrors AppChrome + chat layout so React replaces it without a jump. */
      :root {
        color-scheme: light;
        --qone-boot-background: #fff;
        --qone-boot-foreground: #737373;
        --qone-boot-bone: #f0f0f0;
        --qone-boot-border: #e5e5e5;
        --qone-boot-error-surface: #f7f7f7;
        --qone-boot-sidebar-width: 340px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --qone-boot-background: #0a0a0a;
        --qone-boot-foreground: #a3a3a3;
        --qone-boot-bone: #1f1f1f;
        --qone-boot-border: #262626;
        --qone-boot-error-surface: #171717;
      }

      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--qone-boot-background); }

      .qb { display: flex; flex-direction: column; width: 100%; height: 100%; color: var(--qone-boot-foreground); font: 14px/1.5 system-ui, sans-serif; user-select: none; }
      .qb i { display: block; flex: none; border-radius: 6px; background: var(--qone-boot-bone); animation: qb-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
      @keyframes qb-pulse { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .qb i { animation: none; } }

      .qb-titlebar { display: flex; height: 36px; flex: none; align-items: center; gap: 8px; padding-left: 12px; -webkit-app-region: drag; }
      .qb-titlebar .qb-fill { flex: 1; align-self: stretch; }
      .qb-controls { display: flex; height: 100%; -webkit-app-region: no-drag; }
      .qb-controls button { display: grid; width: 46px; height: 36px; place-items: center; border: 0; background: transparent; color: var(--qone-boot-foreground); }
      .qb-controls button:hover { background: color-mix(in srgb, var(--qone-boot-foreground) 16%, transparent); }
      .qb-controls button:last-child:hover { background: #c42b1c; color: #fff; }
      .qb-controls span { position: relative; display: block; width: 10px; height: 10px; }
      .qb-min { height: 1.5px !important; background: currentColor; }
      .qb-max { box-sizing: border-box; border: 1.5px solid currentColor; }
      .qb-close::before, .qb-close::after { position: absolute; top: 4px; left: -1px; width: 12px; height: 1.5px; background: currentColor; content: ""; transform: rotate(45deg); }
      .qb-close::after { transform: rotate(-45deg); }
      :root[data-qone-boot-web] .qb-controls { display: none; }

      .qb-body { display: flex; min-height: 0; flex: 1; }
      .qb-sidebar { display: flex; width: var(--qone-boot-sidebar-width); max-width: calc(100vw - 240px); flex: none; flex-direction: column; gap: 12px; padding: 0 8px 8px; border-right: 1px solid var(--qone-boot-border); box-sizing: border-box; }
      :root[data-qone-boot-sidebar="collapsed"] .qb-sidebar { width: 3rem; padding-inline: 8px; }
      :root[data-qone-boot-sidebar="collapsed"] .qb-sidebar .qb-wide { display: none; }
      .qb-row { display: flex; align-items: center; gap: 10px; }
      .qb-head { height: 48px; padding-inline: 8px; }
      .qb-list { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 12px; padding: 8px 6px 0; overflow: hidden; }
      .qb-main { display: flex; min-width: 0; flex: 1; flex-direction: column; padding: 0 16px; }
      .qb-thread-head { height: 46px; flex: none; padding-left: clamp(0px, 3.5vw - 16px, 48px); }
      .qb-thread { display: flex; width: 100%; max-width: 48rem; min-height: 0; flex: 1; flex-direction: column; gap: 32px; margin: 0 auto; padding-top: 32px; }
      .qb-lines { display: flex; flex-direction: column; gap: 8px; }
      .qb-composer { box-sizing: border-box; width: 100%; max-width: 48rem; flex: none; margin: 0 auto 8px; padding: 14px 12px 8px; border: 1px solid var(--qone-boot-border); border-radius: 1.5rem; }
    </style>
    <script src="/boot-theme.js"></script>
  </head>
  <body>
    <div id="root">
      <main class="qb" data-qone-boot-label="startup.loading" aria-label="Loading Qone…" aria-busy="true">
        <header class="qb-titlebar">
          <i style="width:52px;height:16px"></i>
          <i style="width:170px;height:14px"></i>
          <div class="qb-fill"></div>
          <div class="qb-controls">
            <button type="button" aria-label="Minimize" data-qone-boot-window="window_minimize"><span class="qb-min"></span></button>
            <button type="button" aria-label="Maximize" data-qone-boot-window="window_maximize_toggle"><span class="qb-max"></span></button>
            <button type="button" aria-label="Close" data-qone-boot-window="window_close"><span class="qb-close"></span></button>
          </div>
        </header>
        <div class="qb-body" aria-hidden="true">
          <aside class="qb-sidebar">
            <div class="qb-row qb-head"><i style="width:16px;height:16px"></i><i class="qb-wide" style="width:64px;height:16px"></i></div>
            <div class="qb-row" style="padding-inline:8px"><i style="width:16px;height:16px"></i><i class="qb-wide" style="width:96px;height:14px"></i></div>
            <div class="qb-row" style="padding-inline:8px"><i style="width:16px;height:16px"></i><i class="qb-wide" style="width:72px;height:14px"></i></div>
            <div class="qb-list qb-wide">
              <i style="width:80px;height:12px"></i>
              <i style="width:100%;height:36px"></i>
              <i style="width:91%;height:36px"></i>
              <i style="width:56px;height:12px;margin-top:16px"></i>
              <i style="width:84%;height:36px"></i>
              <i style="width:100%;height:36px"></i>
            </div>
            <div class="qb-row" style="margin-top:auto;padding-inline:8px"><i style="width:14px;height:14px"></i><i class="qb-wide" style="width:48px;height:14px"></i></div>
          </aside>
          <section class="qb-main">
            <div class="qb-row qb-thread-head"><i style="width:160px;height:16px"></i></div>
            <div class="qb-thread">
              <i style="width:144px;height:40px;margin-left:auto;border-radius:18px"></i>
              <div class="qb-lines">
                <i style="width:96px;height:16px"></i>
                <i style="width:88%;height:16px"></i>
                <i style="width:76%;height:16px"></i>
                <i style="width:92%;height:16px"></i>
                <i style="width:58%;height:16px"></i>
              </div>
            </div>
            <div class="qb-composer">
              <i style="width:68%;height:20px;margin-bottom:20px"></i>
              <div class="qb-row" style="justify-content:space-between">
                <div class="qb-row"><i style="width:28px;height:28px;border-radius:50%"></i><i style="width:112px;height:16px"></i></div>
                <i style="width:28px;height:28px;border-radius:50%"></i>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="/boot-locale.js"></script>
    <script src="/startup-diagnostics.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
